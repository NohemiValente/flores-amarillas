<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>💛 TE QUIERO 💛</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
}


/* =========================================================
   CUERPO
========================================================= */

body {

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 15% 20%,
            #fffde8 0%,
            transparent 25%
        ),

        radial-gradient(
            circle at 85% 15%,
            #ffe99b 0%,
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #fff8dd,
            #ffe28b,
            #f7c94e
        );

    display: flex;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   FONDO
========================================================= */

.fondo {

    position: fixed;

    inset: 0;

    overflow: hidden;

    pointer-events: none;

    z-index: 1;
}


.flota {

    position: absolute;

    top: -70px;

    animation:
        caer linear infinite;

    opacity: 0.65;
}


@keyframes caer {

    0% {

        transform:
            translateY(-80px)
            translateX(0)
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: 0.8;

    }

    50% {

        transform:
            translateY(50vh)
            translateX(60px)
            rotate(180deg);

    }

    100% {

        transform:
            translateY(110vh)
            translateX(-60px)
            rotate(360deg);

        opacity: 0;

    }

}


/* =========================================================
   BRILLITOS
========================================================= */

.brillo {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px white,
        0 0 18px #fff3aa;

    animation:
        parpadear 2s ease-in-out infinite;
}


@keyframes parpadear {

    0%,
    100% {

        opacity: 0.2;

        transform:
            scale(0.6);

    }

    50% {

        opacity: 1;

        transform:
            scale(1.5);

    }

}


/* =========================================================
   TARJETA
========================================================= */

.tarjeta {

    position: relative;

    z-index: 5;

    width: 92vw;

    max-width: 1200px;

    height: 94vh;

    overflow: hidden;

    border-radius: 35px;

    border:
        1px solid
        rgba(255,255,255,0.9);

    background:
        rgba(255,255,255,0.57);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 25px 70px
        rgba(130,90,0,0.25);

    display: flex;

    flex-direction: column;

    align-items: center;

    padding-top: 8px;

    animation:
        aparecer 1.2s ease;
}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   TITULO
========================================================= */

.corazon-titulo {

    height: 25px;

    color: #e2a300;

    font-size: 25px;

    line-height: 25px;

    animation:
        latido 1.8s infinite;
}


@keyframes latido {

    0%,
    100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.25);

    }

}


.titulo {

    color: #986000;

    font-family:
        Georgia,
        serif;

    font-style: italic;

    font-size:
        clamp(
            2.7rem,
            5vw,
            4.2rem
        );

    line-height: 1;

    text-shadow:
        2px 2px 0
        rgba(255,255,255,0.7);
}


.subtitulo {

    color: #795000;

    font-family:
        Georgia,
        serif;

    font-size:
        clamp(
            0.95rem,
            2vw,
            1.25rem
        );

    margin-top: 5px;
}


/* =========================================================
   RAMO
========================================================= */

/*
   ESTA ES LA PARTE IMPORTANTE.

   El ramo ocupa prácticamente todo el ancho
   disponible y ya NO se reduce a 0.72.
*/

.ramo {

    position: relative;

    width: min(1050px, 94vw);

    height: 500px;

    margin-top: 0;

    flex-shrink: 0;

    transform: scale(1);

    transform-origin:
        center top;
}


/* =========================================================
   PAPEL DEL RAMO
========================================================= */

.papel {

    position: absolute;

    width: 620px;

    height: 275px;

    left: 50%;

    bottom: 60px;

    transform:
        translateX(-50%)
        rotate(-3deg);

    background:

        linear-gradient(
            135deg,
            #dfb976,
            #fff0c2,
            #d5a966
        );

    clip-path:

        polygon(
            5% 0,
            95% 0,
            100% 100%,
            0 100%
        );

    z-index: 1;
}


.papel2 {

    position: absolute;

    width: 660px;

    height: 290px;

    left: 50%;

    bottom: 55px;

    transform:
        translateX(-50%)
        rotate(4deg);

    background:
        rgba(255,245,211,0.72);

    clip-path:

        polygon(
            0 0,
            100% 8%,
            88% 100%,
            12% 100%
        );

    z-index: 0;
}


/* =========================================================
   TALLOS
========================================================= */

.tallo {

    position: absolute;

    width: 9px;

    height: 350px;

    bottom: 10px;

    left: 50%;

    background:

        linear-gradient(
            to right,
            #285b2e,
            #6ba84b,
            #285b2e
        );

    border-radius: 20px;

    transform-origin:
        bottom center;

    z-index: 3;
}


.t1 {
    transform:
        translateX(-300px)
        rotate(-25deg);
}


.t2 {
    transform:
        translateX(-220px)
        rotate(-18deg);
}


.t3 {
    transform:
        translateX(-140px)
        rotate(-10deg);
}


.t4 {
    transform:
        translateX(-65px)
        rotate(-4deg);
}


.t5 {
    transform:
        translateX(10px)
        rotate(2deg);
}


.t6 {
    transform:
        translateX(85px)
        rotate(7deg);
}


.t7 {
    transform:
        translateX(160px)
        rotate(13deg);
}


.t8 {
    transform:
        translateX(235px)
        rotate(19deg);
}


.t9 {
    transform:
        translateX(300px)
        rotate(25deg);
}


/* =========================================================
   HOJAS
========================================================= */

.hoja {

    position: absolute;

    width: 125px;

    height: 48px;

    background:

        linear-gradient(
            135deg,
            #7db750,
            #34733a
        );

    border-radius:
        100% 0 100% 0;

    z-index: 4;
}


.hoja1 {

    left: 75px;

    bottom: 190px;

    transform:
        rotate(-30deg);
}


.hoja2 {

    left: 130px;

    bottom: 260px;

    transform:
        rotate(28deg)
        scaleX(-1);
}


.hoja3 {

    left: 205px;

    bottom: 135px;

    transform:
        rotate(-18deg);
}


.hoja4 {

    right: 75px;

    bottom: 195px;

    transform:
        rotate(30deg)
        scaleX(-1);
}


.hoja5 {

    right: 130px;

    bottom: 265px;

    transform:
        rotate(-28deg);
}


.hoja6 {

    right: 205px;

    bottom: 140px;

    transform:
        rotate(18deg)
        scaleX(-1);
}


.hoja7 {

    left: 320px;

    bottom: 105px;

    transform:
        rotate(-15deg);
}


.hoja8 {

    right: 320px;

    bottom: 110px;

    transform:
        rotate(15deg)
        scaleX(-1);
}


/* =========================================================
   FLORES
========================================================= */

.flor {

    position: absolute;

    z-index: 8;

    transform-origin:
        bottom center;

    animation:
        balanceo 4s ease-in-out infinite;
}


@keyframes balanceo {

    0%,
    100% {

        rotate: -1deg;

    }

    50% {

        rotate: 2deg;

    }

}


/* =========================================================
   GIRASOLES
========================================================= */

.girasol {

    width: 200px;

    height: 200px;
}


.girasol .petalo {

    position: absolute;

    width: 65px;

    height: 100px;

    left: 67px;

    top: 50px;

    background:

        linear-gradient(
            to bottom,
            #ffe23d,
            #f3a700
        );

    border-radius: 50%;

    transform-origin:
        center 50px;
}


.girasol .petalo:nth-child(1) {
    transform:
        rotate(0deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(2) {
    transform:
        rotate(30deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(3) {
    transform:
        rotate(60deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(4) {
    transform:
        rotate(90deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(5) {
    transform:
        rotate(120deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(6) {
    transform:
        rotate(150deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(7) {
    transform:
        rotate(180deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(8) {
    transform:
        rotate(210deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(9) {
    transform:
        rotate(240deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(10) {
    transform:
        rotate(270deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(11) {
    transform:
        rotate(300deg)
        translateY(-46px);
}

.girasol .petalo:nth-child(12) {
    transform:
        rotate(330deg)
        translateY(-46px);
}


.girasol .centro {

    position: absolute;

    width: 92px;

    height: 92px;

    left: 54px;

    top: 54px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #75430b,
            #321804
        );

    box-shadow:

        inset
        0 0 0 8px
        #98601a;
}


/* =========================================================
   MARGARITAS
========================================================= */

.margarita {

    width: 135px;

    height: 135px;
}


.margarita .petalo {

    position: absolute;

    width: 40px;

    height: 65px;

    left: 47px;

    top: 32px;

    background:

        linear-gradient(
            white,
            #fffdf0
        );

    border-radius: 50%;

    transform-origin:
        center 32px;
}


.margarita .petalo:nth-child(1) {
    transform:
        rotate(0deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(2) {
    transform:
        rotate(45deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(3) {
    transform:
        rotate(90deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(4) {
    transform:
        rotate(135deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(5) {
    transform:
        rotate(180deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(6) {
    transform:
        rotate(225deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(7) {
    transform:
        rotate(270deg)
        translateY(-25px);
}

.margarita .petalo:nth-child(8) {
    transform:
        rotate(315deg)
        translateY(-25px);
}


.margarita .centro {

    position: absolute;

    width: 45px;

    height: 45px;

    left: 45px;

    top: 45px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #ffdc32,
            #e99d00
        );
}


/* =========================================================
   ROSAS AMARILLAS
========================================================= */

.rosa {

    width: 135px;

    height: 135px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle at center,
            #d98600 0%,
            #f6b51e 15%,
            #ffda4d 35%,
            #efa900 62%,
            #d88900 100%
        );

    box-shadow:
        0 8px 18px
        rgba(150,90,0,0.25);
}


.rosa::before {

    content: "";

    position: absolute;

    width: 84px;

    height: 84px;

    top: 25px;

    left: 25px;

    border-radius: 50%;

    border:
        9px solid
        #ffd94a;

    box-shadow:

        inset
        0 0 0 7px
        #efa900;
}


.rosa::after {

    content: "";

    position: absolute;

    width: 32px;

    height: 32px;

    top: 51px;

    left: 51px;

    border-radius: 50%;

    background:
        #d48600;

    box-shadow:
        0 0 0 6px
        #f5b914;
}


/* =========================================================
   POSICIONES DE LAS FLORES
========================================================= */

/* FLORES GRANDES */

.girasol1 {

    left: 0;

    top: 145px;
}


.girasol2 {

    right: 0;

    top: 155px;

    transform:
        scale(0.95);
}


.girasol3 {

    left: 50%;

    top: -5px;

    transform:
        translateX(-50%)
        scale(1.08);
}


/* MARGARITAS */

.margarita1 {

    left: 135px;

    top: 40px;

    transform:
        scale(0.88);
}


.margarita2 {

    right: 135px;

    top: 50px;

    transform:
        scale(0.88);
}


.margarita3 {

    left: 50%;

    top: 160px;

    transform:
        translateX(-50%)
        scale(0.78);
}


/* ROSAS */

.rosa1 {

    left: 180px;

    top: 190px;

    transform:
        scale(0.86);
}


.rosa2 {

    right: 180px;

    top: 195px;

    transform:
        scale(0.82);
}


/* =========================================================
   FLORES PEQUEÑAS
========================================================= */

.flor-pequena {

    position: absolute;

    width: 24px;

    height: 24px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            #fff5a3 0 30%,
            #f5b900 31% 100%
        );

    z-index: 10;
}


.f1 {
    left: 110px;
    top: 185px;
}

.f2 {
    left: 250px;
    top: 135px;
}

.f3 {
    left: 315px;
    top: 220px;
}

.f4 {
    right: 110px;
    top: 190px;
}

.f5 {
    right: 250px;
    top: 145px;
}

.f6 {
    left: 330px;
    top: 275px;
}

.f7 {
    right: 330px;
    top: 280px;
}


/* =========================================================
   RAMITAS
========================================================= */

.ramita {

    position: absolute;

    width: 7px;

    height: 200px;

    background:
        #5f913f;

    bottom: 220px;

    z-index: 5;

    transform-origin:
        bottom center;
}


.ramita1 {

    left: 55px;

    transform:
        rotate(-27deg);
}


.ramita2 {

    right: 55px;

    transform:
        rotate(27deg);
}


.ramita3 {

    left: 150px;

    transform:
        rotate(-13deg);
}


.ramita4 {

    right: 150px;

    transform:
        rotate(13deg);
}


/* =========================================================
   MOÑO
========================================================= */

.moño {

    position: absolute;

    left: 50%;

    bottom: 112px;

    transform:
        translateX(-50%);

    width: 160px;

    height: 80px;

    z-index: 20;
}


.moño::before,
.moño::after {

    content: "";

    position: absolute;

    width: 100px;

    height: 65px;

    top: 8px;

    background:

        linear-gradient(
            135deg,
            #ffda43,
            #e59c00
        );

    border-radius:
        70% 20% 70% 20%;
}


.moño::before {

    right: 70px;

    transform:
        rotate(25deg);
}


.moño::after {

    left: 70px;

    transform:
        rotate(-25deg);
}


.nudo {

    position: absolute;

    width: 38px;

    height: 38px;

    left: 61px;

    top: 22px;

    border-radius: 50%;

    background:
        #e7a000;

    z-index: 3;
}


/* =========================================================
   ETIQUETA
========================================================= */

.etiqueta {

    position: absolute;

    left: 50%;

    bottom: 160px;

    transform:
        translateX(70px)
        rotate(8deg);

    z-index: 25;

    padding:
        11px 17px;

    background:
        #fff3d0;

    color:
        #815900;

    font-family:
        Georgia,
        serif;

    font-size: 13px;

    box-shadow:
        0 5px 12px
        rgba(80,50,0,0.18);
}


/* =========================================================
   BOTÓN
========================================================= */

/*
   EL BOTÓN ESTÁ DENTRO DEL RAMO.
   Queda justo donde terminan los tallos.
*/

.boton {

    position: absolute;

    left: 50%;

    bottom: 42px;

    transform:
        translateX(-50%);

    z-index: 50;

    min-width: 230px;

    padding:
        14px 40px;

    border:
        3px solid
        rgba(255,239,155,0.95);

    border-radius: 45px;

    background:

        linear-gradient(
            135deg,
            #ffd42f,
            #e5a000
        );

    color: white;

    font-size: 19px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:

        0 8px 25px
        rgba(160,100,0,0.4);

    transition:
        all 0.3s ease;
}


.boton:hover {

    transform:
        translateX(-50%)
        scale(1.08);

    box-shadow:

        0 12px 30px
        rgba(160,100,0,0.5);
}


/* =========================================================
   MENSAJE
========================================================= */

#sorpresa {

    display: none;

    position: absolute;

    left: 50%;

    bottom: 30px;

    transform:
        translateX(-50%);

    z-index: 50;

    width: 75%;

    max-width: 700px;

    padding:
        14px 22px;

    border-radius: 22px;

    background:
        rgba(255,248,210,0.96);

    border:
        1px solid
        rgba(255,255,255,0.9);

    color:
        #765000;

    font-family:
        Georgia,
        serif;

    font-size: 16px;

    line-height: 1.35;

    box-shadow:
        0 8px 25px
        rgba(150,100,0,0.18);

    animation:
        mensaje 1s ease;
}


@keyframes mensaje {

    from {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(20px)
            scale(0.9);

    }

    to {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   TABLET / CELULAR
========================================================= */

@media (max-width: 800px) {

    .tarjeta {

        width: 96vw;

        height: 94vh;

        border-radius: 28px;

        padding-top: 7px;
    }


    .titulo {

        font-size:
            2.4rem;
    }


    .subtitulo {

        font-size:
            0.9rem;
    }


    .ramo {

        width: 900px;

        height: 480px;

        transform:
            scale(0.72);

        transform-origin:
            top center;

        margin-top:
            -10px;
    }


    .boton {

        bottom: 40px;

        min-width: 210px;

        padding:
            13px 30px;

        font-size:
            17px;
    }


    #sorpresa {

        width: 85%;

        bottom: 25px;

        font-size:
            14px;
    }

}


/* =========================================================
   PANTALLAS MUY PEQUEÑAS
========================================================= */

@media (max-width: 500px) {

    .titulo {

        font-size:
            2.1rem;
    }


    .corazon-titulo {

        font-size:
            20px;
    }


    .ramo {

        transform:
            scale(0.55);

        height: 430px;

        margin-top:
            -5px;
    }


    .boton {

        min-width:
            190px;

        padding:
            11px 25px;

        font-size:
            16px;
    }

}


/* =========================================================
   PANTALLAS BAJAS
========================================================= */

/*
   IMPORTANTE:
   NO hacemos scale(0.72) aquí.
   Esta era la causa de que en tu computadora
   el ramo se hiciera pequeño.
*/

@media (max-height: 700px) {

    .tarjeta {

        height: 96vh;
    }


    .titulo {

        font-size:
            2.8rem;
    }


    .ramo {

        height: 480px;

        transform:
            scale(0.98);

        margin-top:
            -5px;
    }


    .boton {

        bottom:
            35px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     FONDO ANIMADO
===================================================== -->

<div
    class="fondo"
    id="fondo">
</div>


<!-- =====================================================
     TARJETA PRINCIPAL
===================================================== -->

<div class="tarjeta">


    <!-- CORAZÓN -->

    <div class="corazon-titulo">
        ♡
    </div>


    <!-- TÍTULO -->

    <h1 class="titulo">
        Te Quiero
    </h1>


    <!-- SUBTÍTULO -->

    <div class="subtitulo">

        
        <span style="color:#e5a900;">
            ♥
        </span>

    </div>


    <!-- =================================================
         RAMO
    ================================================== -->

    <div class="ramo">


        <!-- PAPEL -->

        <div class="papel"></div>

        <div class="papel2"></div>


        <!-- =================================================
             TALLOS
        ================================================== -->

        <div class="tallo t1"></div>

        <div class="tallo t2"></div>

        <div class="tallo t3"></div>

        <div class="tallo t4"></div>

        <div class="tallo t5"></div>

        <div class="tallo t6"></div>

        <div class="tallo t7"></div>

<script>

/* =========================================================
   FONDO: CORAZONES Y FLORES
========================================================= */

const fondo =
    document.getElementById("fondo");


const elementos = [

    "💛",
    "🌼",
    "🌻",
    "♡",
    "💛",
    "🌼",
    "💛",
    "🌻"

];


for (
    let i = 0;
    i < 30;
    i++
) {

    const elemento =
        document.createElement("div");


    elemento.className =
        "flota";


    elemento.innerHTML =
        elementos[
            Math.floor(
                Math.random() *
                elementos.length
            )
        ];


    elemento.style.left =
        Math.random() * 100 + "%";


    elemento.style.fontSize =
        (
            14 +
            Math.random() * 24
        ) + "px";


    elemento.style.animationDuration =
        (
            7 +
            Math.random() * 8
        ) + "s";


    elemento.style.animationDelay =
        (
            -Math.random() * 10
        ) + "s";


    fondo.appendChild(
        elemento
    );

}


/* =========================================================
   BRILLITOS
========================================================= */

for (
    let i = 0;
    i < 20;
    i++
) {

    const brillo =
        document.createElement("div");


    brillo.className =
        "brillo";


    brillo.style.left =
        Math.random() * 100 + "%";


    brillo.style.top =
        Math.random() * 100 + "%";


    brillo.style.animationDelay =
        Math.random() * 3 + "s";


    fondo.appendChild(
        brillo
    );

}


/* =========================================================
   BOTÓN
========================================================= */

function mostrarSorpresa() {


    const boton =
        document.getElementById(
            "boton"
        );


    const mensaje =
        document.getElementById(
            "sorpresa"
        );


    /* -----------------------------------------------
       QUITAR BOTÓN
    ------------------------------------------------ */

    boton.style.display =
        "none";


    /* -----------------------------------------------
       MOSTRAR MENSAJE
    ------------------------------------------------ */

    mensaje.style.display =
        "block";


    /* -----------------------------------------------
       CREAR MÁS CORAZONES Y PÉTALOS
    ------------------------------------------------ */

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        const petalo =
            document.createElement(
                "div"
            );


        petalo.className =
            "flota";


        petalo.innerHTML =
            Math.random() > 0.5
            ? "🌼"
            : "💛";


        petalo.style.left =
            Math.random() * 100 + "%";


        petalo.style.fontSize =
            (
                18 +
                Math.random() * 22
            ) + "px";


        petalo.style.animationDuration =
            (
                5 +
                Math.random() * 5
            ) + "s";


        petalo.style.animationDelay =
            "0s";


        fondo.appendChild(
            petalo
        );

    }

}

</script>
